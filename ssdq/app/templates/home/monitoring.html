{% extends "layouts/base.html" %}

{% block title %} Реестр контролей {% endblock %}

<!-- Element injected in the BODY element -->
{% block body_class %} {% endblock body_class %}

<!-- Specific Page CSS goes HERE  -->
{% block stylesheets %}

<!-- Font Awesome -->
<link rel="stylesheet" href="/static/assets/node_modules/@fortawesome/fontawesome-free/css/all.min.css">
<!-- DataTables -->
<link rel="stylesheet" href="/static/assets/node_modules/datatables.net-bs4/css/dataTables.bootstrap4.min.css">
<link rel="stylesheet" href="/static/assets/node_modules/datatables.net-responsive-bs4/css/responsive.bootstrap4.min.css">
<!-- Theme style -->
<link rel="stylesheet" href="/static/assets/css/adminlte.min.css">

<link rel="stylesheet" href="/static/assets/css/dq_mon.css">

{% endblock stylesheets %}

{% block content %}

<!-- Content Wrapper. Contains page content -->
<div class="content-wrapper">
  <!-- Content Header (Page header) -->
  <section class="content-header">
    <div class="container-fluid">
      <div class="row mb-2">
        <div class="col-sm-6">
          <h1>Реестр контролей</h1>
        </div>
      </div>
    </div><!-- /.container-fluid -->
  </section>

  <!-- Main content -->
  <section class="content">
    <div class="container-fluid">
      <div class="row">
        <div class="col-12">
          <!-- /.card -->
          <div class="card">
            <!-- /.card-header -->
            <div class="card-body table-responsive">
              <div class="card-tools" style="position: absolute; right: 2vw;">
                <ul class="nav nav-pills">
                  <li class="nav-item">
                    <a href="/controls/create" data-title="Создать ККД"
                      class="nav-link tip-top">
                      <i class="nav-icon fas fa-plus fa-lg"></i>
                    </a>
                  </li>
                </ul>
              </div>
              <!-- <div class="scroll-table"> -->
              <div style="display:flex; gap:12px; align-items:center; margin-bottom: 10px;">
                <button id="btnResetFilters" class="btn btn-outline-primary">Сброс фильтров</button>
                <button id="btnResetColumns" class="btn btn-outline-primary">Сброс колонок</button>
                <button id="btnExportCsv" class="btn btn-outline-primary">Экспорт CSV (всё по фильтрам)</button>
                <a data-title="Вкл/выкл выбранные контроли в Airflow" class="nav-link tip-right">
                  <i id="allDagToggle" class="fas fa-toggle-off fa-toggle"></i>
                </a>
              </div>

              <div id="monitoringGrid" class="ag-theme-quartz" style="height: 700px; width: 100%;"></div>
              <!-- </div> -->
            </div>
            <!-- /.card-body -->
          </div>
          <!-- /.card -->
        </div>
        <!-- /.col -->
      </div>
      <!-- /.row -->
    </div>
    <div class="modal fade" id="modal-loading">
      <div class="modal-dialog">
          <div class="modal-content">
              <div class="modal-body">
                  <div class="d-flex justify-content-center">
                      <div class="spinner-border text-success m-5" style="width: 7rem; height: 7rem;"></div>
                  </div>
              </div>
          </div>
          <!-- /.modal-content -->
      </div>
      <!-- /.modal-dialog -->
  </div>
    <!-- /.container-fluid -->
  </section>
  <!-- /.content -->
</div>

{% endblock content %}

<!-- Specific Page JS goes HERE  -->
{% block javascripts %}

<script type="text/javascript">
  window.csrf_token = "{{ csrf_token() }}";
</script>
<!-- jQuery -->
<script src="/static/assets/node_modules/jquery/dist/jquery.min.js"></script>
<!-- Bootstrap 4 -->
<script src="/static/assets/node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/assets/js/datatable_handler/utils.js"></script>
<script src="/static/assets/node_modules/ag-grid-community/dist/ag-grid-community.min.js"></script>
<script src="/static/assets/js/ag_grid/toggle_columns.js"></script>
<script src="/static/assets/js/ag_grid/utils.js"></script>
<script src="/static/assets/js/api/apiAirflow.js"></script>
<script src="/static/assets/js/views/monitoring.js"></script>

{% endblock javascripts %}
